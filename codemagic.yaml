workflows:
  android-workflow:
    name: Build Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android Debug APK
        script: |
          gradle assembleDebug
    artifacts:
      - "**/*.apk"
